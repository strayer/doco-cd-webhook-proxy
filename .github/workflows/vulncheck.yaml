# Scheduled binary-mode govulncheck against the latest published image:
# catches vulnerabilities disclosed after the last build, when no PR or
# release would otherwise trigger a scan. This proxy has zero third-party
# dependencies, so its entire vulnerability surface is the Go stdlib and
# toolchain - exactly what govulncheck tracks.
name: Vulncheck

permissions:
  contents: read
  packages: read

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  scan:
    name: govulncheck (published image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract binary from latest published image
        run: |
          # :latest only exists once a stable (non-prerelease) tag was released;
          # until then fall back to :dev, built from main on every push.
          image=ghcr.io/${{ github.repository }}:latest
          if ! docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "::notice::No :latest image published yet, scanning :dev instead"
            image=ghcr.io/${{ github.repository }}:dev
          fi
          docker pull "$image"
          id=$(docker create "$image")
          docker cp "$id":/proxy ./published-proxy
          docker rm "$id"
      - name: Scan published binary
        run: govulncheck -mode binary ./published-proxy
